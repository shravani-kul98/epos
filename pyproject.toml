[project]
name = "epos-lite-project-intelligence"
version = "0.1.0"
description = "EPOS Lite — AI-Enabled Engineering Project Intelligence & Traceability Dashboard (local-only prototype)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "streamlit>=1.49",
    "pandas>=2.2",
    "pydantic>=2.7",
    "plotly>=5.22",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "black>=24.4",
    # FastAPI's TestClient needs it; the API tests cannot run without it.
    "httpx>=0.27",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
